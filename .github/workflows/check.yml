name: Vérification SHDM

on:
  # Une fois par jour vers 18 h à Montréal. GitHub compte en UTC sans heure d'été :
  # 22 h UTC donne 18 h l'été et 17 h l'hiver. GitHub peut retarder le passage.
  schedule:
    - cron: "7 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verification
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Interroger la SHDM
        env:
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: python check.py

      - name: Enregistrer les données et la page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Vérification du $(TZ=America/Toronto date '+%Y-%m-%d %H:%M')"
          git push
